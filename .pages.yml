media: images
content:
  - name: artikler
    label: Artikkelarkiv
    type: collection
    path: content/artikler
    fields:
      - name: draft
        label: Deaktiver / Sett som kladd
        type: boolean
        default: false
        description: Huk av her hvis artikkelen skal skjules fra nettsiden uten å slettes.
      - name: title
        label: Overskrift
        type: string
        required: true
      - name: summary
        label: Ingress (kort oppsummering på forsiden)
        type: text
      - name: image
        label: Hovedbilde
        type: image
      - name: kicker
        label: Kicker (Kategori, f.eks. INDUSTRI eller LOKALT)
        type: string
      - name: date
        label: Publiseringstidspunkt
        type: date
      - name: body
        label: Hele artikkelen (Brødtekst)
        type: text
