<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iByn.no – Nyheter og samfunn i Mosjøen og Vefsn</title>
    <!-- Include Marked.js to parse Markdown content into HTML -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --bg-color: #f8f9fa;
            --text-color: #1a1a1a;
            --accent-color: #b91c1c;
            --muted-color: #555555;
            --card-bg: #ffffff;
            --border-color: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Georgia', serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
        }

        /* Masthead / Header */
        header {
            background-color: #ffffff;
            border-bottom: 3px solid var(--text-color);
            padding: 1.8rem 1rem 1.2rem;
            text-align: center;
        }

        .masthead-title {
            font-family: 'Times New Roman', Times, serif;
            font-size: 3.5rem;
            font-weight: 900;
            letter-spacing: -1px;
            text-transform: uppercase;
            color: var(--text-color);
            text-decoration: none;
            cursor: pointer;
        }

        .masthead-title span {
            color: var(--accent-color);
        }

        .masthead-sub {
            font-family: system-ui, -apple-system, sans-serif;
            font-size: 0.9rem;
            color: var(--muted-color);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-top: 0.3rem;
        }

        /* Main Container */
        main {
            max-width: 1100px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        /* Kicker / Category Badge */
        .kicker {
            display: inline-block;
            font-family: system-ui, -apple-system, sans-serif;
            font-size: 0.78rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--accent-color);
            margin-bottom: 0.5rem;
        }

        .byline {
            font-family: system-ui, -apple-system, sans-serif;
            font-size: 0.85rem;
            color: var(--muted-color);
            margin-top: 1rem;
            padding-top: 0.75rem;
            border-top: 1px solid var(--border-color);
        }

        /* Clickable Headlines & Images */
        .article-link {
            color: var(--text-color);
            text-decoration: none;
            transition: color 0.15s ease;
        }

        .article-link:hover {
            color: var(--accent-color);
            text-decoration: underline;
        }

        .image-link {
            display: block;
            overflow: hidden;
        }

        /* Lead Article (Top Story on Frontpage) */
        .lead-story {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-top: 4px solid var(--accent-color);
            margin-bottom: 2.5rem;
            box-shadow: 0 2px 6px rgba(0,0,0,0.04);
        }

        .lead-story img {
            width: 100%;
            max-height: 480px;
            object-fit: cover;
            display: block;
            border-bottom: 1px solid var(--border-color);
        }

        .lead-story-content {
            padding: 2rem 2.2rem;
        }

        .lead-story h1 {
            font-size: 2.4rem;
            line-height: 1.2;
            margin-bottom: 0.85rem;
        }

        .lead-story .ingress {
            font-size: 1.2rem;
            color: #2d2d2d;
            line-height: 1.55;
        }

        /* Section Title */
        .section-header {
            font-family: system-ui, -apple-system, sans-serif;
            font-size: 1rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 2px solid var(--text-color);
            padding-bottom: 0.4rem;
            margin-bottom: 1.5rem;
        }

        /* News Grid for Articles */
        .news-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1.5rem;
            margin-bottom: 3rem;
        }

        .news-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 1px 4px rgba(0,0,0,0.03);
        }

        .news-card img {
            width: 100%;
            height: 210px;
            object-fit: cover;
            display: block;
            border-bottom: 1px solid var(--border-color);
        }

        .news-card-content {
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            justify-content: space-between;
        }

        .news-card h2 {
            font-size: 1.4rem;
            line-height: 1.3;
            margin-bottom: 0.65rem;
        }

        .news-card .ingress {
            font-size: 1rem;
            color: #333333;
            line-height: 1.5;
        }

        /* Single Article View (Full Story) */
        #single-article-view {
            display: none;
            max-width: 800px;
            margin: 0 auto 3rem;
        }

        .back-button {
            display: inline-flex;
            align-items: center;
            font-family: system-ui, -apple-system, sans-serif;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--accent-color);
            text-decoration: none;
            margin-bottom: 1.5rem;
            cursor: pointer;
        }

        .back-button:hover {
            text-decoration: underline;
        }

        .full-article {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-top: 4px solid var(--accent-color);
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .full-article-hero {
            width: 100%;
            max-height: 520px;
            object-fit: cover;
            display: block;
            border-bottom: 1px solid var(--border-color);
        }

        .full-article-inner {
            padding: 2.5rem;
        }

        .full-article h1 {
            font-size: 2.5rem;
            line-height: 1.2;
            margin-bottom: 1rem;
        }

        .full-article .lead-ingress {
            font-size: 1.25rem;
            font-weight: 600;
            color: #222222;
            line-height: 1.55;
            margin-bottom: 1.5rem;
        }

        .full-article .article-body {
            font-size: 1.12rem;
            line-height: 1.75;
            color: #1f1f1f;
            margin-top: 1.5rem;
        }

        .full-article .article-body p {
            margin-bottom: 1.25rem;
        }

        .full-article .article-body h2,
        .full-article .article-body h3 {
            margin: 1.8rem 0 0.8rem;
            line-height: 1.3;
        }

        .full-article .article-body img {
            max-width: 100%;
            height: auto;
            margin: 1.5rem 0;
            border-radius: 2px;
        }

        .loading-state {
            font-family: system-ui, -apple-system, sans-serif;
            color: var(--muted-color);
            font-style: italic;
            padding: 1rem 0;
        }

        footer {
            text-align: center;
            padding: 2rem 1rem;
            border-top: 1px solid var(--border-color);
            font-family: system-ui, -apple-system, sans-serif;
            font-size: 0.85rem;
            color: var(--muted-color);
            margin-top: 3rem;
        }

        @media (max-width: 640px) {
            .masthead-title { font-size: 2.5rem; }
            .lead-story h1, .full-article h1 { font-size: 1.75rem; }
            .lead-story-content, .full-article-inner { padding: 1.4rem; }
        }
    </style>
</head>
<body>

    <header>
        <a href="#" class="masthead-title">iByn<span>.no</span></a>
        <div class="masthead-sub">Uavhengig lokalavis for Mosjøen og Vefsn</div>
    </header>

    <main>
        <!-- FRONTPAGE VIEW -->
        <div id="frontpage-view">
            <!-- Newest article displayed as top story -->
            <div id="lead-article-container"></div>

            <h2 class="section-header">Siste artikler</h2>
            
            <!-- Grid of articles showing image, headline and summary -->
            <div id="cms-articles-container" class="news-grid">
                <div class="loading-state">Henter siste saker...</div>
            </div>
        </div>

        <!-- FULL ARTICLE VIEW (shown when clicking a headline) -->
        <div id="single-article-view">
            <a href="#" class="back-button">&larr; Tilbake til forsiden</a>
            <div id="full-article-container"></div>
        </div>
    </main>

    <footer>
        &copy; 2026 iByn.no – Publisert via Cloudflare Pages
    </footer>

    <script>
        // GitHub repository settings
        const GITHUB_OWNER = 'villmones';
        const GITHUB_REPO = 'ibyn';
        const ARTICLES_PATH = 'content/artikler';

        // Store loaded articles in memory for instant navigation
        let allArticles = [];

        // Normalize image URL so images uploaded to 'images/' work reliably
        function resolveImageUrl(imagePath) {
            if (!imagePath) return '';
            if (imagePath.startsWith('http://') || imagePath.startsWith('https://')) {
                return imagePath;
            }
            const cleanPath = imagePath.replace(/^\/+/, '');
            return `https://raw.githubusercontent.com/${GITHUB_OWNER}/${GITHUB_REPO}/main/${cleanPath}`;
        }

        // Extract plain text fallback summary if 'summary' field is empty
        function getSummary(article) {
            if (article.summary && article.summary.trim() !== '') {
                return article.summary.trim();
            }
            if (!article.body) return '';
            // Strip markdown formatting and grab the first paragraph
            const plain = article.body
                .replace(/!\[.*?\]\(.*?\)/g, '')
                .replace(/\[([^\]]+)\]\(.*?\)/g, '$1')
                .replace(/[#>*_`~-]/g, '')
                .trim();
            const firstParagraph = plain.split(/\n\s*\n/)[0] || plain;
            return firstParagraph.length > 220 ? firstParagraph.substring(0, 220) + '…' : firstParagraph;
        }

        // Parse YAML Frontmatter and Markdown body from raw .md file
        function parseFrontmatter(rawText, filename) {
            const slug = filename.replace(/\.md$/, '');
            const frontmatterRegex = /^---\r?\n([\s\S]*?)\r?\n---\r?\n?([\s\S]*)$/;
            const match = rawText.match(frontmatterRegex);

            const metadata = {
                slug: slug,
                title: 'Uten tittel',
                summary: '',
                image: '',
                date: '',
                kicker: 'NYHETER',
                body: rawText
            };

            if (match) {
                const yamlBlock = match[1];
                metadata.body = match[2].trim();

                const lines = yamlBlock.split(/\r?\n/);
                let currentKey = null;
                let multilineBuffer = [];

                for (const line of lines) {
                    const keyValMatch = line.match(/^([a-zA-Z0-9_-]+):\s*(.*)$/);
                    if (keyValMatch) {
                        // Save previous multiline field if applicable
                        if (currentKey && multilineBuffer.length > 0) {
                            metadata[currentKey] = multilineBuffer.join('\n').trim();
                            multilineBuffer = [];
                        }
                        currentKey = keyValMatch[1].trim();
                        let val = keyValMatch[2].trim();
                        val = val.replace(/^["'](.*)["']$/, '$1');

                        if (val === '|' || val === '>' || val === '|-') {
                            // Start of multiline block in YAML
                            multilineBuffer = [];
                        } else {
                            metadata[currentKey] = val;
                        }
                    } else if (currentKey) {
                        multilineBuffer.push(line.replace(/^\s{2}/, ''));
                    }
                }

                if (currentKey && multilineBuffer.length > 0) {
                    metadata[currentKey] = multilineBuffer.join('\n').trim();
                }
            }
            return metadata;
        }

        // Format date string into Norwegian readable format
        function formatNorwegianDate(dateStr) {
            if (!dateStr) return '';
            const parsed = new Date(dateStr);
            if (isNaN(parsed.getTime())) return dateStr;
            return parsed.toLocaleDateString('no-NO', {
                day: 'numeric',
                month: 'long',
                year: 'numeric'
            });
        }

        // Render Frontpage (Lead story + News Grid with image, heading and ingress)
        function renderFrontpage() {
            const leadContainer = document.getElementById('lead-article-container');
            const gridContainer = document.getElementById('cms-articles-container');

            if (allArticles.length === 0) {
                gridContainer.innerHTML = '<p>Ingen publiserte artikler ennå.</p>';
                return;
            }

            // 1. Top Story (newest article)
            const newest = allArticles[0];
            const newestImg = resolveImageUrl(newest.image);
            const newestSummary = getSummary(newest);

            leadContainer.innerHTML = `
                <article class="lead-story">
                    ${newestImg ? `
                        <a href="#${encodeURIComponent(newest.slug)}" class="image-link">
                            <img src="${newestImg}" alt="${newest.title}">
                        </a>
                    ` : ''}
                    <div class="lead-story-content">
                        <span class="kicker">${newest.kicker || 'AKTUELT'}</span>
                        <h1>
                            <a href="#${encodeURIComponent(newest.slug)}" class="article-link">${newest.title}</a>
                        </h1>
                        ${newestSummary ? `<p class="ingress">${newestSummary}</p>` : ''}
                        ${newest.date ? `<div class="byline">Publisert ${formatNorwegianDate(newest.date)}</div>` : ''}
                    </div>
                </article>
            `;

            // 2. News Grid (all articles with image, heading and ingress)
            gridContainer.innerHTML = allArticles.map(art => {
                const imgUrl = resolveImageUrl(art.image);
                const summaryText = getSummary(art);
                return `
                    <article class="news-card">
                        ${imgUrl ? `
                            <a href="#${encodeURIComponent(art.slug)}" class="image-link">
                                <img src="${imgUrl}" alt="${art.title}">
                            </a>
                        ` : ''}
                        <div class="news-card-content">
                            <div>
                                <span class="kicker">${art.kicker || 'NYHETER'}</span>
                                <h2>
                                    <a href="#${encodeURIComponent(art.slug)}" class="article-link">${art.title}</a>
                                </h2>
                                ${summaryText ? `<p class="ingress">${summaryText}</p>` : ''}
                            </div>
                            ${art.date ? `<div class="byline">Publisert ${formatNorwegianDate(art.date)}</div>` : ''}
                        </div>
                    </article>
                `;
            }).join('');
        }

        // Render Single Full Article View
        function renderSingleArticle(slug) {
            const article = allArticles.find(a => a.slug === slug);
            const fullContainer = document.getElementById('full-article-container');

            if (!article) {
                window.location.hash = '';
                return;
            }

            const imgUrl = resolveImageUrl(article.image);
            const hasDedicatedSummary = article.summary && article.summary.trim() !== '';

            fullContainer.innerHTML = `
                <article class="full-article">
                    ${imgUrl ? `<img src="${imgUrl}" alt="${article.title}" class="full-article-hero">` : ''}
                    <div class="full-article-inner">
                        <span class="kicker">${article.kicker || 'NYHETER'}</span>
                        <h1>${article.title}</h1>
                        ${hasDedicatedSummary ? `<p class="lead-ingress">${article.summary}</p>` : ''}
                        ${article.date ? `<div class="byline">Publisert ${formatNorwegianDate(article.date)}</div>` : ''}
                        <div class="article-body">${marked.parse(article.body || '')}</div>
                    </div>
                </article>
            `;
        }

        // Handle switching between Frontpage and Full Article based on URL hash
        function handleRoute() {
            const hash = decodeURIComponent(window.location.hash.replace(/^#/, ''));
            const frontpageView = document.getElementById('frontpage-view');
            const singleArticleView = document.getElementById('single-article-view');

            if (hash && allArticles.some(a => a.slug === hash)) {
                renderSingleArticle(hash);
                frontpageView.style.display = 'none';
                singleArticleView.style.display = 'block';
                window.scrollTo(0, 0);
            } else {
                frontpageView.style.display = 'block';
                singleArticleView.style.display = 'none';
            }
        }

        // Fetch all Markdown files from GitHub repository
        async function loadArticles() {
            const gridContainer = document.getElementById('cms-articles-container');

            try {
                const apiUrl = `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${ARTICLES_PATH}`;
                const response = await fetch(apiUrl);

                if (!response.ok) {
                    throw new Error(`Kunne ikke hente artikkelmappen (${response.status})`);
                }

                const files = await response.json();
                const mdFiles = files.filter(file => file.name.endsWith('.md'));

                if (mdFiles.length === 0) {
                    gridContainer.innerHTML = '<p>Ingen publiserte artikler ennå.</p>';
                    return;
                }

                // Fetch raw content for each markdown file concurrently
                allArticles = await Promise.all(
                    mdFiles.map(async (file) => {
                        const res = await fetch(file.download_url);
                        const text = await res.text();
                        return parseFrontmatter(text, file.name);
                    })
                );

                // Sort articles newest first based on date
                allArticles.sort((a, b) => {
                    const dateA = new Date(a.date || 0).getTime();
                    const dateB = new Date(b.date || 0).getTime();
                    return dateB - dateA;
                });

                renderFrontpage();
                handleRoute();

            } catch (error) {
                console.error('Error loading articles:', error);
                gridContainer.innerHTML = '<p>Kunne ikke laste inn artikler akkurat nå.</p>';
            }
        }

        // Listen for hash changes when user clicks a headline or "Tilbake til forsiden"
        window.addEventListener('hashchange', handleRoute);
        document.addEventListener('DOMContentLoaded', loadArticles);
    </script>
</body>
</html>
