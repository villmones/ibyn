<!-- Facebook Share Button -->
<div class="facebook-share-container" style="margin-top: 30px; padding-top: 15px; border-top: 1px solid #eee;">
  <a id="fb-share-btn" href="#" target="_blank" rel="noopener noreferrer" style="display: inline-flex; align-items: center; background-color: #1877f2; color: white; padding: 8px 16px; border-radius: 6px; text-decoration: none; font-family: sans-serif; font-size: 14px; font-weight: 500;">
    <svg style="width: 16px; height: 16px; margin-right: 8px; fill: currentColor;" viewBox="0 0 24 24"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
    Del på Facebook
  </a>
</div>

<script>
  // Dynamically set the share URL without the # hash so Facebook picks up Open Graph tags
  document.addEventListener("DOMContentLoaded", () => {
    const shareBtn = document.getElementById("fb-share-btn");
    if (shareBtn) {
      // Get current path or hash to form clean URL (e.g., https://www.ibyn.no/artikkel-slug)
      const currentSlug = window.location.hash ? window.location.hash.substring(1) : window.location.pathname.replace(/^\/+/, "");
      const cleanUrl = `https://www.ibyn.no/${currentSlug.split('?')[0]}`;
      shareBtn.href = `https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(cleanUrl)}`;
    }
  });
</script>
