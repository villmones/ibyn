<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iByn.no – Nyheter og samfunn i Mosjøen og Vefsn</title>
    <!-- Include Marked.js to parse Markdown body into HTML -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --bg-color: #f8f9fa;
            --text-color: #1a1a1a;
            --accent-color: #b91c1c;
            --muted-color: #555555;
            --card-bg: #ffffff;
            --border-color: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Georgia', serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
        }

        /* Masthead / Header */
        header {
            background-color: #ffffff;
            border-bottom: 3px solid var(--text-color);
            padding: 1.8rem 1rem 1.2rem;
            text-align: center;
        }

        .masthead-title {
            font-family: 'Times New Roman', Times, serif;
            font-size: 3.5rem;
            font-weight: 900;
            letter-spacing: -1px;
            text-transform: uppercase;
            color: var(--text-color);
            text-decoration: none;
        }

        .masthead-title span {
            color: var(--accent-color);
        }

        .masthead-sub {
            font-family: system-ui, -apple-system, sans-serif;
            font-size: 0.9rem;
            color: var(--muted-color);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-top: 0.3rem;
        }

        /* Main Container */
        main {
            max-width: 1100px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        /* Kicker / Category Badge */
        .kicker {
            display: inline-block;
            font-family: system-ui, -apple-system, sans-serif;
            font-size: 0.78rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--accent-color);
            margin-bottom: 0.5rem;
        }

        .byline {
            font-family: system-ui, -apple-system, sans-serif;
            font-size: 0.85rem;
            color: var(--muted-color);
            margin-top: 1rem;
            padding-top: 0.75rem;
            border-top: 1px solid var(--border-color);
        }

        /* Lead Article (Top Story) */
        .lead-story {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-top: 4px solid var(--accent-color);
            padding: 2.2rem;
            margin-bottom: 2.5rem;
            box-shadow: 0 2px 6px rgba(0,0,0,0.04);
        }

        .lead-story h1 {
            font-size: 2.4rem;
            line-height: 1.2;
            margin-bottom: 1rem;
        }

        .lead-story .article-body {
            font-size: 1.15rem;
            color: #2d2d2d;
        }

        .lead-story .article-body p {
            margin-bottom: 1rem;
        }

        /* Section Title */
        .section-header {
            font-family: system-ui, -apple-system, sans-serif;
            font-size: 1rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 2px solid var(--text-color);
            padding-bottom: 0.4rem;
            margin-bottom: 1.5rem;
        }

        /* News Grid for Articles */
        .news-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1.5rem;
            margin-bottom: 3rem;
        }

        .news-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 1.6rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 1px 4px rgba(0,0,0,0.03);
        }

        .news-card h2 {
            font-size: 1.45rem;
            line-height: 1.3;
            margin-bottom: 0.75rem;
        }

        .news-card .article-body {
            font-size: 1rem;
            color: #333333;
        }

        .news-card .article-body p {
            margin-bottom: 0.8rem;
        }

        .loading-state {
            font-family: system-ui, -apple-system, sans-serif;
            color: var(--muted-color);
            font-style: italic;
            padding: 1rem 0;
        }

        footer {
            text-align: center;
            padding: 2rem 1rem;
            border-top: 1px solid var(--border-color);
            font-family: system-ui, -apple-system, sans-serif;
            font-size: 0.85rem;
            color: var(--muted-color);
            margin-top: 3rem;
        }
    </style>
</head>
<body>

    <header>
        <a href="/" class="masthead-title">iByn<span>.no</span></a>
        <div class="masthead-sub">Uavhengig lokalavis for Mosjøen og Vefsn</div>
    </header>

    <main>
        <!-- Container where the newest CMS article or lead story will appear -->
        <div id="lead-article-container"></div>

        <h2 class="section-header">Siste artikler</h2>
        
        <!-- Dynamic container for articles from Pages CMS (content/artikler) -->
        <div id="cms-articles-container" class="news-grid">
            <div class="loading-state">Henter siste saker...</div>
        </div>
    </main>

    <footer>
        &copy; 2026 iByn.no – Publisert via Cloudflare Pages
    </footer>

    <script>
        // Configuration for GitHub repository
        const GITHUB_OWNER = 'villmones';
        const GITHUB_REPO = 'ibyn';
        const ARTICLES_PATH = 'content/artikler';

        // Parse YAML Frontmatter and Markdown body from raw .md file
        function parseFrontmatter(rawText) {
            const frontmatterRegex = /^---\r?\n([\s\S]*?)\r?\n---\r?\n?([\s\S]*)$/;
            const match = rawText.match(frontmatterRegex);

            const metadata = {
                title: 'Uten tittel',
                date: '',
                kicker: 'NYHETER',
                body: rawText
            };

            if (match) {
                const yamlBlock = match[1];
                metadata.body = match[2].trim();

                // Parse key-value lines in YAML frontmatter
                const lines = yamlBlock.split(/\r?\n/);
                let currentKey = null;
                let bodyLines = [];

                for (const line of lines) {
                    const keyValMatch = line.match(/^([a-zA-Z0-9_-]+):\s*(.*)$/);
                    if (keyValMatch) {
                        currentKey = keyValMatch[1].trim();
                        let val = keyValMatch[2].trim();
                        // Strip surrounding quotes if present
                        val = val.replace(/^["'](.*)["']$/, '$1');
                        if (currentKey === 'body' && val && val !== '|' && val !== '>') {
                            bodyLines.push(val);
                        } else if (currentKey !== 'body') {
                            metadata[currentKey] = val;
                        }
                    } else if (currentKey === 'body') {
                        bodyLines.push(line.replace(/^\s{2}/, ''));
                    }
                }

                // If Pages CMS stored 'body' inside frontmatter instead of markdown body
                if (!metadata.body && bodyLines.length > 0) {
                    metadata.body = bodyLines.join('\n').trim();
                }
            }
            return metadata;
        }

        // Format date string into Norwegian readable format
        function formatNorwegianDate(dateStr) {
            if (!dateStr) return '';
            const parsed = new Date(dateStr);
            if (isNaN(parsed.getTime())) return dateStr;
            return parsed.toLocaleDateString('no-NO', {
                day: 'numeric',
                month: 'long',
                year: 'numeric'
            });
        }

        // Fetch and render all Markdown files from content/artikler
        async function loadArticles() {
            const gridContainer = document.getElementById('cms-articles-container');
            const leadContainer = document.getElementById('lead-article-container');

            try {
                const apiUrl = `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${ARTICLES_PATH}`;
                const response = await fetch(apiUrl);

                if (!response.ok) {
                    throw new Error(`Kunne ikke hente artikkelmappen (${response.status})`);
                }

                const files = await response.json();
                // Filter only .md files (ignore .gitkeep etc.)
                const mdFiles = files.filter(file => file.name.endsWith('.md'));

                if (mdFiles.length === 0) {
                    gridContainer.innerHTML = '<p>Ingen publiserte artikler ennå.</p>';
                    return;
                }

                // Fetch raw content for each markdown file concurrently
                const articles = await Promise.all(
                    mdFiles.map(async (file) => {
                        const res = await fetch(file.download_url);
                        const text = await res.text();
                        return parseFrontmatter(text);
                    })
                );

                // Sort articles newest first based on date
                articles.sort((a, b) => {
                    const dateA = new Date(a.date || 0).getTime();
                    const dateB = new Date(b.date || 0).getTime();
                    return dateB - dateA;
                });

                // Render the newest article as the Lead Story on top
                const newest = articles[0];
                leadContainer.innerHTML = `
                    <article class="lead-story">
                        <span class="kicker">${newest.kicker || 'AKTUELT'}</span>
                        <h1>${newest.title}</h1>
                        <div class="article-body">${marked.parse(newest.body || '')}</div>
                        ${newest.date ? `<div class="byline">Publisert ${formatNorwegianDate(newest.date)}</div>` : ''}
                    </article>
                `;

                // Render all articles (or remaining articles) in the news grid
                gridContainer.innerHTML = articles.map(art => `
                    <article class="news-card">
                        <div>
                            <span class="kicker">${art.kicker || 'NYHETER'}</span>
                            <h2>${art.title}</h2>
                            <div class="article-body">${marked.parse(art.body || '')}</div>
                        </div>
                        ${art.date ? `<div class="byline">Publisert ${formatNorwegianDate(art.date)}</div>` : ''}
                    </article>
                `).join('');

            } catch (error) {
                console.error('Error loading articles:', error);
                gridContainer.innerHTML = '<p>Kunne ikke laste inn artikler akkurat nå.</p>';
            }
        }

        // Initialize article loading on page load
        document.addEventListener('DOMContentLoaded', loadArticles);
    </script>
</body>
</html>
