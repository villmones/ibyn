name: Compress Images

on:
  push:
    paths:
      - 'images/**'
  workflow_dispatch: # Lar deg også starte komprimering av eksisterende bilder manuelt med ett klikk

permissions:
  contents: write

jobs:
  build:
    name: calibreapp/image-actions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Compress Images
        id: calibre
        uses: calibreapp/image-actions@main
        with:
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          jpegQuality: '80'
          pngQuality: '80'
          webpQuality: '80'
          ignorePaths: 'node_modules/**'
          compressOnly: true

      - name: Create Commit
        if: steps.calibre.outputs.markdown != ''
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add images/
          git commit -m "Auto-compressed images" || exit 0
          git push
